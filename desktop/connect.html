<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; form-action https://chapterchase.invalid">
  <title>Connect to NAS</title>
  <style>
    body { background: #202124; color: #fff; font: 14px system-ui; padding: 24px; }
    label { display: block; margin-bottom: 12px; }
    input { box-sizing: border-box; width: 100%; padding: 10px; margin-bottom: 16px; }
    button { padding: 8px 20px; }
  </style>
</head>
<body>
  <form action="https://chapterchase.invalid/connect" method="get">
    <label for="server">ChapterChase NAS address</label>
    <input id="server" name="server" type="url" placeholder="https://your-nas.your-tailnet.ts.net" required autofocus>
    <button type="submit">Connect</button>
  </form>
</body>
</html>
