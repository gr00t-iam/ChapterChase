services:
  chapterchase:
    build: .
    container_name: chapterchase
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/data/chapterchase.db"
      CHAPTERCHASE_DATA_DIR: "/data"
      CHAPTERCHASE_LIBRARY_DIR: "/library"
      CHAPTERCHASE_MEDIA_ROOTS: "/library:/share:/mnt"
      CHAPTERCHASE_RESTRICT_MEDIA_ROOTS: "false"
      NODE_ENV: "production"
    volumes:
      - chapterchase-data:/data
      # Replace the left side with your NAS mount or local book folder.
      # Windows example after mounting a NAS share: C:/Mounted/Books:/library:ro
      # Linux example: /mnt/books:/library:ro
      - ./library:/library:ro
    restart: unless-stopped

volumes:
  chapterchase-data:
