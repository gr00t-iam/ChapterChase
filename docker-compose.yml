services:
  chapterchase:
    build: .
    container_name: chapterchase
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      DATABASE_URL: "file:/data/chapterchase.db"
      CHAPTERCHASE_DATA_DIR: "/data"
      CHAPTERCHASE_LIBRARY_DIR: "/library"
      CHAPTERCHASE_MEDIA_ROOTS: "/library"
      CHAPTERCHASE_RESTRICT_MEDIA_ROOTS: "false"
      CHAPTERCHASE_SECURE_COOKIES: "false"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: "production"
      PORT: "3000"
      HARDCOVER_API_KEY: "${HARDCOVER_API_KEY:-}"
    volumes:
      - /volume1/Docker/chapterchase/data:/data
      - /volume1/home/gr00t/Books:/library:ro
    restart: unless-stopped
